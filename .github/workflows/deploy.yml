name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.list.outputs.deployments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          echo "deployments=$(find deploy -mindepth 2 -maxdepth 2 -name wrangler.jsonc | cut -d/ -f2 | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: list
    if: needs.list.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.list.outputs.deployments) }}
    concurrency:
      group: deploy-${{ matrix.deployment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_CONFIG: ${{ github.workspace }}/deploy/${{ matrix.deployment }}/wrangler.jsonc
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler d1 migrations apply DB --remote --config "$WRANGLER_CONFIG"
      # No --config: the build left .wrangler/deploy/config.json pointing at
      # dist/server/wrangler.json, which wrangler picks up on its own.
      - run: pnpm exec wrangler deploy
